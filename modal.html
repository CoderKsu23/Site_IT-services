<dialog id="modal" >
	<button class="close-btn" id="closeModal">&times;</button>
		<h2 class="modal__title">Оставить заявку</h2>
		<p class="modal__text">Мы ответим в течение рабочего дня и предложим оптимальный формат сотрудничества. Ваш бизнес останется в надёжных руках</p>
		<form method="dialog" id="requestForm">
			<input class="input_subject" type="text" id="username" placeholder="Ваше имя" autocomplete="name">
			<input class="input_subject phone-input" type="tel" id="phone" required>
			<input class="input_subject" type="text" id="task" placeholder="Кратко опишите свою задачу">
			<button class="btn submit-btn" type="submit">Отправить</button>
		</form>
		<p class="modal__text">Нажимая кнопку «Отправить» вы соглашаетесь с политикой обработки персональных данных</p>
</dialog>
